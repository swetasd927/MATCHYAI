name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, 'feat/*', 'fix/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend CI (Node & TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Run Typecheck
        run: |
          cd backend
          npm run typecheck

      - name: Build Backend
        run: |
          cd backend
          npm run build

  frontend-ci:
    name: Frontend CI (Next.js & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Build Next.js Frontend
        run: |
          cd frontend
          npm run build
